server {
    listen 80;
    listen [::]:80;
    server_name wildbound.kunini.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/apps/wildbound/dist;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wildbound.kunini.ru;

    ssl_certificate /home/dekunin/letsencrypt/live/wildbound.kunini.ru/fullchain.pem;
    ssl_certificate_key /home/dekunin/letsencrypt/live/wildbound.kunini.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 32k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 60s;

    location = /healthz {
        proxy_pass http://127.0.0.1:4173/healthz;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Auth-User "";
        proxy_set_header X-Auth-User-Id "";
        proxy_set_header X-Auth-Roles "";
    }

    location = /_kunini_auth_verify {
        internal;
        proxy_pass http://127.0.0.1:3030/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_set_header X-Auth-User "";
        proxy_set_header X-Auth-User-Id "";
        proxy_set_header X-Auth-Roles "";
    }

    location @kunini_login {
        return 302 https://auth.kunini.ru/login?return_to=https://$host$request_uri;
    }

    location @kunini_api_unauthorized {
        return 401;
    }

    location = /api/events {
        proxy_pass http://127.0.0.1:4173/api/events;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Auth-User "";
        proxy_set_header X-Auth-User-Id "";
        proxy_set_header X-Auth-Roles "";
    }

    location = /api/stats {
        auth_request /_kunini_auth_verify;
        error_page 401 = @kunini_api_unauthorized;
        auth_request_set $kunini_user $upstream_http_x_auth_user;
        auth_request_set $kunini_user_id $upstream_http_x_auth_user_id;
        auth_request_set $kunini_roles $upstream_http_x_auth_roles;

        proxy_pass http://127.0.0.1:4173/api/stats;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Auth-User $kunini_user;
        proxy_set_header X-Auth-User-Id $kunini_user_id;
        proxy_set_header X-Auth-Roles $kunini_roles;
    }

    location = /stats {
        auth_request /_kunini_auth_verify;
        error_page 401 = @kunini_login;
        auth_request_set $kunini_user $upstream_http_x_auth_user;
        auth_request_set $kunini_user_id $upstream_http_x_auth_user_id;
        auth_request_set $kunini_roles $upstream_http_x_auth_roles;

        proxy_pass http://127.0.0.1:4173/stats;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Auth-User $kunini_user;
        proxy_set_header X-Auth-User-Id $kunini_user_id;
        proxy_set_header X-Auth-Roles $kunini_roles;
    }

    location = /stats/ {
        return 308 /stats;
    }

    location = /stats.html {
        return 308 /stats;
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Auth-User "";
        proxy_set_header X-Auth-User-Id "";
        proxy_set_header X-Auth-Roles "";
    }
}
